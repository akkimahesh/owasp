name: OWASP ZAP Authenticated Scan

on:
  workflow_dispatch:

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # If your application is deployed in a previous job,
      # replace this with a proper health check.
      - name: Wait for application
        run: |
          sleep 30

      - name: Run OWASP ZAP
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/zap:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd \
            -autorun /zap/wrk/automation.yaml

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/report.html